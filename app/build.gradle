plugins { id 'com.android.application' }

// Nomor build otomatis naik di GitHub Actions (dipakai untuk membandingkan versi saat update OTA).
def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "0").toInteger()

android {
    namespace 'com.savequest.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.savequest.app"
        minSdk 26
        targetSdk 34
        versionCode 1000 + runNumber
        versionName "2.2." + runNumber
    }

    // Kunci TETAP (ikut di repo) supaya setiap build punya tanda tangan sama.
    // Android hanya mau menimpa (update) aplikasi jika tanda tangannya identik.
    signingConfigs {
        savequest {
            storeFile file('keystore/savequest.p12')
            storePassword 'savequest'
            keyAlias 'savequest'
            keyPassword 'savequest'
            storeType 'pkcs12'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.savequest }
        release {
            signingConfig signingConfigs.savequest
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
}
